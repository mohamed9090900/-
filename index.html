/* Midnight turquoise visual theme — presentation only; business logic unchanged */
:root{color-scheme:dark;--bg:#04151c;--surface:#0b222d;--surface2:#0d2a35;--ink:#f5fbff;--muted:#b2c8d2;--muted2:#87a5b3;--line:#245a6b;--brand:#062a35;--brand2:#0c3a46;--accent:#00c9aa;--accentSoft:#0d3c3b;--good:#65dfad;--goodSoft:#103d32;--warn:#ffcc7c;--warnSoft:#43321b;--danger:#ff9399;--dangerSoft:#4b222b;--violet:#c0a7ff;--violetSoft:#312746;--shadow:0 12px 28px rgba(0,0,0,.25)}
html{background:#04151c}body{background:#04151c!important;color:var(--ink);font-family:"Tajawal","Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif}
.topbar{background:rgba(4,21,28,.96);border-bottom:1px solid #145465;box-shadow:0 5px 25px #0004}
.brand{color:#f6ffff}.brand-mark{background:linear-gradient(145deg,#074d58,#092431);border:1px solid #00bda7;box-shadow:0 0 13px #00c9aa55}
.brand small,.version{color:#b2d2d8}.version{background:#103440}
.hero h1,.project-head h1,.section-toolbar h2{color:#fff}.hero p,.project-desc{color:var(--muted)}
.card,.project-card,.section-block,.photos-box,.finance-shell,.revenue-shell{background:linear-gradient(155deg,#0d2934,#091f29)!important;border:1px solid #206376!important;box-shadow:0 7px 22px #0004!important;color:#f5fbff}

.project-total,.section-header,.item-table td,.item-table th,.revenue-table td,.revenue-table th{border-color:#235365!important}
.meta,.caption,.stat .label,.stat .sub,.section-note,.metric-line,.category-note,.category-totals,.item-note,.hint,.mini-note,.simple-profit-note,.finance-note{color:var(--muted)!important}
.empty{color:var(--muted)}.empty strong{color:#fff}.empty-icon{background:#113943;box-shadow:0 0 0 1px #216778}

.stat,.simple-profit-card,.scenario-card,.finance-kpis>div{background:#102e39!important;border:1px solid #286373!important;color:#f5fbff}.stat .value,.simple-profit-card strong,.scenario-card strong,.finance-kpis b{color:#f6fbff}

.category{background:#0a2731;border-color:#276476}.category-head{background:#11313e}.category-totals b,.metric-line b{color:#f4fcff}
.item-table,.revenue-table{background:#0b2631;color:#effaff}.item-table th,.revenue-table th{background:#103440!important;color:#d0e4ed!important}.item-table td,.revenue-table td{background:#0b2631;color:#f5fbff}
.tag{background:#24365c;color:#c9d9ff}.tag.monthly{background:#103d32;color:#9bffd0}.tag.annual{background:#43321b;color:#ffda9b}
.status.confirmed{background:#103d32;color:#8cf6b9}.status.research{background:#312746;color:#dacaff}.status.replace{background:#43321b;color:#ffd391}
.summary-row,.summary,.summary-card,.capital-formula,.summary-wrap>div{border-color:#286373}
.simple-profit-card.final{background:#113440!important}.simple-profit-card.final.positive{border-color:#258e69}.simple-profit-card.final.negative{border-color:#a64e59}.simple-profit-card.final.neutral{border-color:#377182}
.scenario-card.expected{background:linear-gradient(145deg,#0b4b49,#103440)!important;border-color:#00c9aa;box-shadow:0 0 13px #00c9aa25}
.scenario-top b{background:#153c47;color:#b4d4dc}.scenario-foot{border-color:#276171}.scenario-foot b{color:#f3fbff}
.finance-empty{background:#0a2b36;border-color:#347485;color:#f4fbff}.finance-empty span{color:var(--muted)}
.searchbox input,.field input,.field select,.field textarea,input,select,textarea{background:#082632!important;color:#f4fbff!important;border:1px solid #37788a!important;outline:none}
input::placeholder,textarea::placeholder{color:#9bb9c5;opacity:1}.field label{color:#d3eaf0}.field input:focus,.field select:focus,.field textarea:focus,.searchbox input:focus{border-color:#00e4c6!important;box-shadow:0 0 0 3px #00c9aa22!important}
.inline-summary{background:#10323d;border-color:#317080;color:#b6d4de}.inline-summary b{color:#fff}
.photo,.thumb{background:#123744;border-color:#286a78}
dialog{background:#0b2430;color:#f4fbff;border:1px solid #317485}dialog::backdrop{background:#000b}.modal-head,.modal-foot{background:#102f3b;border-color:#296172}.modal-body{background:#0b2430}
.danger-zone{background:#361f27;border-color:#8b4651}.danger-zone strong{color:#ffc2c7}
.toast{background:#06463f;color:#eafffb;border:1px solid #00c9aa}
